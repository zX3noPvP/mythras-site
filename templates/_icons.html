{#- Inline SVG icon set (Lucide-style strokes) + Mythras logo. Use: {{ icon('shield') }} -#}

{% macro icon(name, cls="") -%}
<svg class="ic {{ cls }}" width="20" height="20" aria-hidden="true" focusable="false"><use href="#i-{{ name }}"></use></svg>
{%- endmacro %}

{% macro logo(cls="") -%}
<svg class="logo {{ cls }}" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><use href="#i-logo"></use></svg>
{%- endmacro %}

{% macro flag(code, cls="") -%}
<svg class="flag {{ cls }}" width="22" height="15" viewBox="0 0 60 40" aria-hidden="true" focusable="false"><use href="#flag-{{ code }}"></use></svg>
{%- endmacro %}
